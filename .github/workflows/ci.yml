name: Test, Build and Deploy

on:
  push:
    branches: [main]  # Only trigger on main branch pushes

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (same version as the Docker image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  build-and-push:
    needs: test  # Only publish a new image if the tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx # modern Docker builder that supports multi-platform builds
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile  # change if your Dockerfile has a different name or path
          push: true
          tags: usmangoat/telco-fastapi:latest
          build-args: GIT_SHA=${{ github.sha }}  # served at /version

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  deploy:
    needs: build-and-push  # Only deploy an image that passed the tests and was published
    runs-on: ubuntu-latest
    concurrency:  # A newer push supersedes a deploy still in progress
      group: render-production
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render deploy of this exact image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: docker.io/usmangoat/telco-fastapi@${{ needs.build-and-push.outputs.digest }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set; skipping deploy (use Manual Deploy on Render)"
            echo "SKIP_SMOKE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Pin the deploy to the digest built above, not whatever :latest points to
          IMG=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGE")
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG}" > /dev/null
          echo "Deploy triggered for $IMAGE"

      - name: Smoke test production
        if: env.SKIP_SMOKE != '1'
        run: python3 scripts/smoke_test.py https://telco-fastapi.onrender.com ${{ github.sha }}